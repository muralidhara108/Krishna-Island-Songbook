<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3E4C4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Krishna Island Songbook">
<style>:root{color-scheme:light}</style>
<title>Krishna Island Songbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one phone-width column. Home is a list of songs as glass tiles; a song shows each verse centred with its translation under it, a top bar with back and settings, and a fixed previous/next bar. */
:root{
  --ground:#F3E4C4; --halo-a:rgba(240,150,60,.30); --halo-b:rgba(226,186,110,.55); --halo-c:rgba(255,255,255,.7);
  --ink:#1F2A5C; --soft:#454E7C; --accent:#9A4A0E; --on-accent:#FFFFFF;
  --row:rgba(255,255,255,.52); --row-hi:rgba(255,255,255,.78); --hair:rgba(31,42,92,.16);
  --glass:rgba(255,248,232,.72); --shadow:0 12px 30px -16px rgba(90,50,10,.4);
  --sel-bg:rgba(154,74,14,.16); --mark:#C98A12;
  --f-serif:"Noto Serif","Georgia","Liberation Serif",serif;
  --f-ui:"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --bar:60px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1230; --halo-a:rgba(120,70,150,.38); --halo-b:rgba(40,46,110,.6); --halo-c:rgba(140,120,230,.30);
    --ink:#F3EEE2; --soft:#C9C6E0; --accent:#E9B65A; --on-accent:#1A1530;
    --row:rgba(255,255,255,.08); --row-hi:rgba(255,255,255,.15); --hair:rgba(255,255,255,.16);
    --glass:rgba(22,26,64,.78); --shadow:0 12px 30px -14px rgba(0,0,0,.65);
    --sel-bg:rgba(233,182,90,.22); --mark:#E9B94A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1230; --halo-a:rgba(120,70,150,.38); --halo-b:rgba(40,46,110,.6); --halo-c:rgba(140,120,230,.30);
  --ink:#F3EEE2; --soft:#C9C6E0; --accent:#E9B65A; --on-accent:#1A1530;
  --row:rgba(255,255,255,.08); --row-hi:rgba(255,255,255,.15); --hair:rgba(255,255,255,.16);
  --glass:rgba(22,26,64,.78); --shadow:0 12px 30px -14px rgba(0,0,0,.65);
  --sel-bg:rgba(233,182,90,.22); --mark:#E9B94A; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--ground);
  background-image:radial-gradient(75% 26% at 100% 2%,var(--halo-c),transparent),radial-gradient(80% 34% at 0% 46%,var(--halo-b),transparent),radial-gradient(75% 30% at 100% 82%,var(--halo-a),transparent);
  background-attachment:fixed;color:var(--ink);font:16px/1.55 var(--f-ui);padding-inline:16px;padding-block:0 48px}
body.in-song{padding-block-end:calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin-inline:auto}

/* top bar */
.topbar{position:fixed;z-index:8;top:0;left:50%;transform:translateX(-50%);width:min(560px,100%);padding:env(safe-area-inset-top,0px) 16px 14px;height:calc(var(--bar) + 14px + env(safe-area-inset-top,0px));
  display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;pointer-events:none;
  background:linear-gradient(180deg,var(--ground) 0%,color-mix(in srgb,var(--ground) 80%,transparent) 60%,transparent 100%)}
.topbar>*{pointer-events:auto}
.gbtn{width:44px;height:44px;padding:0;border:1px solid var(--hair);border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--glass);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}
.gbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gbtn[aria-expanded="true"]{color:var(--accent)}
.gbtn:active{transform:scale(.95)}
#b-back{grid-column:1}
#tb-t{grid-column:2;text-align:center;min-width:0}
#tb-t h1{margin:0;font:600 16px/1.2 var(--f-serif);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tb-t p{margin:2px 0 0;font:400 11.5px/1.2 var(--f-ui);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#b-set{grid-column:3}

main{padding-top:calc(var(--bar) + 20px + env(safe-area-inset-top,0px))}

/* home */
.hero{text-align:center;padding:12px 0 22px}
.hero .mark{display:block;width:46px;height:46px;margin:0 auto 10px;color:var(--accent)}
.hero h2{margin:0;font:600 30px/1.12 var(--f-serif);letter-spacing:.005em;text-wrap:balance}
.hero p{margin:8px 0 0;color:var(--soft);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.cont{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 14px;padding:12px 16px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.cont svg{width:20px;height:20px;flex:none;fill:currentColor}
.cont span{min-width:0}
.cont .k{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.cont .v{display:block;font:600 16px/1.3 var(--f-serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px 14px 16px;border:1px solid var(--hair);border-radius:16px;background:var(--row);cursor:pointer;text-align:left;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:background .15s ease}
.tile:hover{background:var(--row-hi)}
.tile:active{background:var(--sel-bg)}
.tile .t{flex:1;min-width:0}
.tile .vi{display:block;font:600 17px/1.3 var(--f-serif);overflow-wrap:anywhere}
.tile .vd{display:block;margin-top:2px;font-size:12.5px;line-height:1.35;color:var(--soft)}
.tile svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin:22px 0 0;text-align:center;font-size:12.5px;color:var(--soft)}

/* song */
.shead{text-align:center;padding:4px 0 8px}
.shead h2{margin:0;font:600 25px/1.2 var(--f-serif);text-wrap:balance;overflow-wrap:anywhere}
.shead .by{margin:6px 0 0;font-size:13px;color:var(--soft)}
.verse{padding:18px 0 4px}
.vsep{display:flex;justify-content:center;padding:6px 0}
.vsep i{display:block;width:44px;height:1px;background:var(--hair);position:relative}
.vsep i::after{content:"";position:absolute;left:50%;top:-2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--mark)}
.vbox{width:100%;text-align:center;font-family:var(--f-serif)}
.ln{display:block;line-height:1.55;font-size:19px}
.vnum{margin:6px 0 0;text-align:center;font:500 13px/1.2 var(--f-serif);color:var(--accent);letter-spacing:.08em}
.vnum.ref{font-style:italic;letter-spacing:.04em}
.trad{margin:12px 0 0;color:var(--soft);line-height:1.6;max-width:62ch;margin-inline:auto}
.offs{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:o}
.offs li{counter-increment:o;position:relative;padding:12px 14px 12px 48px;border:1px solid var(--hair);border-radius:14px;background:var(--row);line-height:1.5}
.offs li::before{content:counter(o);position:absolute;left:14px;top:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12.5px/1 var(--f-ui);background:var(--sel-bg);color:var(--accent)}
.note{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--sel-bg);color:var(--ink);font-size:14.5px;line-height:1.5}

/* bottom bar */
#vnav{position:fixed;z-index:8;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;
  background:linear-gradient(0deg,var(--ground) 0%,color-mix(in srgb,var(--ground) 82%,transparent) 65%,transparent 100%)}
#vnav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 14px;border:1px solid var(--hair);border-radius:23px;background:var(--glass);box-shadow:var(--shadow);cursor:pointer;font:500 14px/1 var(--f-ui);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#vnav button.nx{background:var(--accent);color:var(--on-accent);border-color:transparent}
#vnav button:disabled{opacity:.45;cursor:default}
#vnav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#vnav .cnt{flex:none;min-width:54px;text-align:center;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}

/* settings */
#pop{position:fixed;z-index:9;top:calc(var(--bar) + 6px + env(safe-area-inset-top,0px));right:max(16px,calc(50% - 264px));width:min(300px,calc(100% - 32px));padding:16px;border:1px solid var(--hair);border-radius:18px;background:var(--glass);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5)}
#pop h3{margin:0 0 8px;font:600 12px/1.2 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
#pop .grp+.grp{margin-top:16px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--row)}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;cursor:pointer;font:500 14px/1 var(--f-ui)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{height:38px;min-width:44px;padding:0 12px;border:1px solid var(--hair);border-radius:10px;background:var(--row);cursor:pointer;font:600 15px/1 var(--f-ui)}
.stepper button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.stepper output{flex:1;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:0;border:0;background:none;cursor:pointer;font-size:15px;text-align:left}
.sw i{flex:none;position:relative;width:46px;height:28px;border-radius:14px;background:var(--hair);transition:background .15s ease}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .15s ease}
.sw[aria-checked="true"] i{background:var(--accent)}
.sw[aria-checked="true"] i::after{transform:translateX(18px);background:var(--on-accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="topbar">
    <button type="button" class="gbtn" id="b-back" data-act="back" aria-label="Back to songs" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="tb-t"></div>
    <button type="button" class="gbtn" id="b-set" data-act="set" aria-label="Settings" aria-expanded="false" aria-controls="pop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>
  <main id="view"></main>
</div>
<nav id="vnav" aria-label="Song navigation" hidden></nav>
<div id="pop" role="dialog" aria-label="Settings" hidden></div>

<script>
var SONGS = [{"title": "MAHA MANTRA", "byline": "", "verses": [{"n": null, "label": "", "lines": ["Hare Krishna, Hare Krishna,", "Krishna Krishna, Hare Hare", "Hare Rama, Hare Rama,", "Rama Rama, Hare Hare"], "tr": ""}]}, {"title": "The Pancha Tattva Mantra", "byline": "", "verses": [{"n": null, "label": "", "lines": ["Jaya sri-krishna-caitanya prabhu nityananda", "sri-advaita gadadhara srivasadi-gaura-bhakta-vrnda"], "tr": ""}]}, {"title": "Sri Sri Gurv-ashtaka", "byline": "Eight Prayers to the Guru · Srila Visvanatha Cakravarti Thakura", "verses": [{"n": 1, "label": "", "lines": ["saḿsāra-dāvānala-līḍha-loka-", "trāṇāya kāruṇya-ghanāghanatvam", "prāptasya kalyāṇa-guṇārṇavasya", "vande guroḥ śrī-caraṇāravindam"], "tr": "The spiritual master is receiving benediction from the ocean of mercy. Just as a cloud pours water on a forest fire to extinguish it, so the spiritual master delivers the materially afflicted world by extinguishing the blazing fire of material existence. I offer my respectful obeisances unto the lotus feet of such a spiritual master, who is an ocean of auspicious qualities."}, {"n": 2, "label": "", "lines": ["mahāprabhoḥ kīrtana-nṛtya-gīta-", "vāditra-mādyan-manaso rasena", "romāñca -kampāśru-tarańga-bhājo", "vande guroḥ śrī-caraṇāravindam"], "tr": "Chanting the holy name, dancing in ecstasy, singing, and playing musical instruments, the spiritual master is always gladdened by the sankirtana movement of Lord Caitanya Mahaprabhu. Because he is relishing the mellows of pure devotion within his mind, sometimes his hair stands on end, he feels quivering in his body, and tears flow from his eyes like waves. I offer my respectful obeisances unto the lotus feet of such a spiritual master."}, {"n": 3, "label": "", "lines": ["śrī-vigrahārādhana-nitya-nānā-", "śṛńgāra-tan-mandira-mārjanādau", "yuktasya bhaktāḿś ca niyuñjato 'pi", "vande guroḥ śrī-caraṇāravindam"], "tr": "The spiritual master is always engaged in the temple worship of Sri Sri Radha and Krishna. He also engages his disciples in such worship. They dress the Deities in beautiful clothes and ornaments, clean Their temple, and perform other similar worship of the Lord. I offer my respectful obeisances unto the lotus feet of such a spiritual master."}, {"n": 4, "label": "", "lines": ["catur-vidha-śrī-bhagavat-prasāda-", "svādv-anna-tṛptān hari-bhakta-sańghān", "kṛtvaiva tṛptiḿ bhajataḥ sadaiva", "vande guroḥ śrī-caraṇāravindam"], "tr": "The spiritual master is always offering Krishna four kinds of delicious food [analyzed as that which is licked, chewed, drunk, and sucked]. When the spiritual master sees that the devotees are satisfied by eating bhagavat-prasada, he is satisfied. I offer my respectful obeisances unto the lotus feet of such a spiritual master."}, {"n": 5, "label": "", "lines": ["śrī-rādhikā-mādhavayor apāra-", "mādhurya-līlā guṇa-rūpa-nāmnām", "prati-kṣaṇāsvādana-lolupasya", "vande guroḥ śrī-caraṇāravindam"], "tr": "The spiritual master is always eager to hear and chant about the unlimited conjugal pastimes of Radhika and Madhava, and Their qualities, names, and forms. The spiritual master aspires to relish these at every moment. I offer my respectful obeisances unto the lotus feet of such a spiritual master."}, {"n": 6, "label": "", "lines": ["nikuñja-yūno rati-keli-siddhyai", "yā yālibhir yuktir apekṣaṇīyā", "tatrāti-dākṣyād ati-vallabhasya", "vande guroḥ śrī-caraṇāravindam"], "tr": "The spiritual master is very dear, because he is expert in assisting the gopis, who at different times make different tasteful arrangements for the perfection of Radha and Krishna’s conjugal loving affairs within the groves of Vrindavana. I offer my most humble obeisances unto the lotus feet of such a spiritual master."}, {"n": 7, "label": "", "lines": ["sākṣād-dharitvena samasta-śāstrair", "uktas tathā bhāvyata eva sadbhiḥ", "kintu prabhor yaḥ priya eva tasya", "vande guroḥ śrī-caraṇāravindam"], "tr": "The spiritual master is to be honored as much as the Supreme Lord, because he is the most confidential servitor of the Lord. This is acknowledged in all revealed scriptures and followed by all authorities. Therefore I offer my respectful obeisances unto the lotus feet of such a spiritual master, who is a bona fide representative of Sri Hari [Krishna]."}, {"n": 8, "label": "", "lines": ["yasya prasādād bhagavat-prasādo", "yasyāprasādān na gatiḥ kuto 'pi", "dhyāyan stuvaḿs tasya yaśas tri-sandhyaḿ", "vande guroḥ śrī-caraṇāravindam"], "tr": "By the mercy of the spiritual master one receives the benediction of Krishna. Without the grace of the spiritual master, one cannot make any advancement. Therefore, I should always remember and praise the spiritual master. At least three times a day I should offer my respectful obeisances unto the lotus feet of my spiritual master."}]}, {"title": "Sri Tulasi-Aarti", "byline": "", "verses": [{"n": 1, "label": "", "lines": ["namo namah tulasi krishna-preyasi namo namah", "radha-krishna-seva pabo ei abilashi"], "tr": "O Tulasi, beloved of Krishna, I bow before you again and again. My desire is to obtain the service of Sri Sri Radha and Krishna."}, {"n": 2, "label": "", "lines": ["ye tomara sarana loy, tara vancha purna hoy", "kripa kori’ koro tare vrindavana-vasi"], "tr": "Whoever takes shelter of you has his wishes fulfilled. Bestowing your mercy on him, you make him a resident of Vrindavana."}, {"n": 3, "label": "", "lines": ["mora ei abhilasha, vilasa kunje dio vasa", "nayana heribo sada yugala-rupa-rasi"], "tr": "My desire is that you will also give me a residence in the pleasure groves of Sri Vrindavana-dhama. Thus within my vision I will always behold the beautiful pastimes of Radha and Krishna."}, {"n": 4, "label": "", "lines": ["ei nivedana dhara, sakhira anugata koro", "seva-adhikara diye koro nija dasi"], "tr": "I beg you to make me a follower of the cowherd damsels of Vraja. Please give me the privilege of devotional service and make me your own maidservant."}, {"n": 5, "label": "", "lines": ["dina krishna-dase koy, ei yena mora hoy", "sri-radha-govinda-preme sada yena bhasi"], "tr": "This very fallen and lowly servant of Krsna prays, \"May I always swim in the love of Sri Radha and Govinda."}]}, {"title": "Sri Tulasi Pranama", "byline": "", "verses": [{"n": null, "label": "", "lines": ["vṛndāyai tulasī-devyai", "priyāyai keśavasya ca", "viṣṇu-bhakti-prade devī", "satya vatyai namo namaḥ"], "tr": "I offer my repeated obeisances unto Vrinda, Srimati Tulasi Devi, who is very dear to Lord Kesava. O goddess, you bestow devotional service to Krishna and you possess the highest truth."}]}, {"title": "Sri Guru-vandana", "byline": "The Worship of Sri Guru", "verses": [{"n": 1, "label": "", "lines": ["sri-guru-carana-padma, kevala-bhakati-sadma,", "bando mui savadhana mate", "jahara prasade bhai, e bhava toriya jai,", "krishna-prapti hoy jaha ha’te"], "tr": "The lotus feet of our spiritual master are the only way by which we can attain pure devotional service. I bow to his lotus feet with great awe and reverence. By his grace one can cross the ocean of material suffering and obtain the mercy of Krishna."}, {"n": 2, "label": "", "lines": ["guru-mukha-padma-vakya, cittete koriya aikya,", "ar na koriho mane asa", "sri-guru-carane rati, ei se uttama-gati,", "je prasade pure sarva asa"], "tr": "My only wish is to have my consciousness purified by the words emanating from his lotus mouth. Attachment to his lotus feet is the perfection that fulfills all desires."}, {"n": 3, "label": "", "lines": ["cakshu-dan dilo jei, janme janme prabhu sei,", "divya jnan hride prokasito", "prema-bhakti jaha hoite, avidya vinasa jate,", "vede gay jahara carito"], "tr": "He opens my darkened eyes and fills my heart with transcendental knowledge. He is my Lord birth after birth. From him ecstatic prema emanates; by him ignorance is destroyed. The Vedic scriptures sing of his character."}, {"n": 4, "label": "", "lines": ["sri-guru karuna-sindhu, adhama janara bandhu,", "lokanath lokera jivana", "ha ha prabhu koro doya, deho more pada-chaya,", "ebe jasa ghushuk tribhuvana"], "tr": "Our spiritual master is the ocean of mercy, the friend of the poor, and the lord and master of the devotees. O master! Be merciful unto me. Give me the shade of your lotus feet. Your fame is spread all over the three worlds."}]}, {"title": "Sri Nama-kirtana", "byline": "Chanting of the Holy Names · from Gitavali", "verses": [{"n": 1, "label": "", "lines": ["yasomati-nandana, braja-baro-nagara,", "gokula-ranjana kana", "gopi-parana-dhana, madana-manohara,", "kaliya-damana-vidhana"], "tr": "Lord Krishna is the beloved son of mother Yasoda; the transcendental lover in the land of Vraja; the delight of Gokula; Kana [a nickname of Krishna]; the wealth of the lives of the gopis. He steals the mind of even Cupid and punishes the Kaliya serpent."}, {"n": 2, "label": "", "lines": ["amala harinam amiya-vilasa", "vipina-purandara, navina nagara-bora,", "bamsi-badana suvasa"], "tr": "These pure, holy names of Lord Hari are full of sweet, nectarean pastimes. Krishna is the Lord of the twelve forests of Vraja, He is ever-youthful and is the best of lovers. He is always playing on a flute, and He is an excellent dresser."}, {"n": 3, "label": "", "lines": ["braja-jana-palana, asura-kula-nasana", "nanda-godhana-rakhowala", "govinda madhava, navanita-taskara,", "sundara nanda-gopala"], "tr": "Krishna is the protector of the inhabitants of Vraja; the destroyer of various demoniac dynasties; the keeper and tender of Nanda Maharaja’s cows; the giver of pleasure to the cows, land, and spiritual senses; the husband of the goddess of fortune; the butter thief; and the beautiful cowherd boy of Nanda Maharaja."}, {"n": 4, "label": "", "lines": ["yamuna-tata-cara, gopi-basana-hara,", "rasa-rasika, kripamoya", "sri-radha-vallabha, brindabana-natabara,", "bhakativinod-asraya"], "tr": "Krishna wanders along the banks of the River Yamuna. He stole the garments of the young damsels of Vraja who were bathing there. He delights in the mellows of the rasa dance; He is very merciful; the lover and beloved of Srimati Radharani; the great dancer of Vrindavana; and the shelter and only refuge of Thakura Bhaktivinoda."}]}, {"title": "Sri Siksastakam", "byline": "", "verses": [{"n": 1, "label": "", "lines": ["ceto-darpana-marjanam bhava-maha--davagni-nirvapanam", "shreyah-kairava-chandrika-vitaranam vidya-vadhu-jivanam", "anandambudhi-vardhanam prati-padam purnamritaswadanam", "sarvatma-snapanam param vijayate sri-krishna-sankirtanam"], "tr": "Glory to the Sri Krishna Sankirtana, which cleanses the heart of all the dust accumulated for years and extinguishes the fire of conditional life, of repeated birth and death. This sankirtana movement is the prime benediction for humanity at large because it spreads the rays of the benediction moon. It is the life of all transcendental knowledge. It increases the ocean of transcendental bliss, and it enables us to fully taste the nectar for which we are always anxious."}, {"n": 2, "label": "", "lines": ["namnam akari bahudha nija-sarva-shaktis", "tatrarpita niyamitah smarane na kalah", "etadrishi tava kripa bhagavan mamapi", "durdaivam idrisham ihajani nanuragaha"], "tr": "O my Lord, Your holy name alone can render all benediction to living beings, and thus You have hundreds and millions of names like Krishna and Govinda. In these transcendental names You have invested all Your transcendental energies. There are not even hard and fast rules for chanting these names. O my Lord, out of kindness You enable us to easily approach You by Your holy names, but I am so unfortunate that I have no attraction for them."}, {"n": 3, "label": "", "lines": ["trinad api sunichena", "taror api sahishnuna", "amanina manadena", "kirtaniyah sada harih"], "tr": "One should chant the holy name of the Lord in a humble state of mind, thinking oneself lower than the straw in the street; one should be more tolerant than a tree, devoid of all sense of false prestige and should be ready to offer all respect to others. In such a state of mind one can chant the holy name of the Lord constantly."}, {"n": 4, "label": "", "lines": ["na dhanam na janam na sundarim", "kavitam va jagad-isha kamaye", "mama janmani janmanishvare", "bhavatad bhaktir ahaituki twayi"], "tr": "O almighty Lord, I have no desire to accumulate wealth, nor do I desire beautiful women, nor do I want any number of followers. I only want Your causeless devotional service birth after birth."}, {"n": 5, "label": "", "lines": ["ayi nanda-tanuja kinkaram", "patitam mam vishame bhavambudhau", "kripaya tava pada-pankaja-", "sthita-dhuli-sadrisham vichintaya"], "tr": "O son of Maharaja Nanda [Krishna], I am Your eternal servitor, yet somehow or other I have fallen into the ocean of birth and death. Please pick me up from this ocean of death and place me as one of the atoms at Your lotus feet."}, {"n": 6, "label": "", "lines": ["nayanam galad-ashru-dharaya", "vadanam gadgada-ruddhaya gira", "pulakair nichitam vapuh kada", "tava nama-grahane bhavishyati"], "tr": "O my Lord, when will my eyes be decorated with tears of love flowing constantly when I chant Your holy name? When will my voice choke up, and when will the hairs of my body stand on end at the recitation of Your name?"}, {"n": 7, "label": "", "lines": ["yugayitam nimeshena", "chakshusha pravrishayitam", "shunyayitam jagat sarvam", "govinda-virahena me"], "tr": "O Govinda! Feeling Your separation, I am considering a moment to be like twelve years or more. Tears are flowing from my eyes like torrents of rain, and I am feeling all vacant in the world in Your absence."}, {"n": 8, "label": "", "lines": ["ashlishya va pada-ratam pinashtu mam", "adarshanan marma-hatam karotu va", "yatha tatha va vidadhatu lampato", "mat-prana-nathas tu sa eva naparah"], "tr": "I know no one but Krishna as my Lord, and He shall remain so even if He handles me roughly by His embrace or makes me brokenhearted by not being present before me. He is completely free to do anything and everything, for He is always my worshipful Lord unconditionally."}]}, {"title": "The Ten Offenses to the Holy Name", "byline": "Vyasadeva · Padma Purana (Brahma Khanda 25.15–18)", "verses": [], "kind": "list", "items": ["To blaspheme the devotees who have dedicated their lives for propagating the holy name of the Lord.", "To consider the names of demigods like Lord Shiva or Lord Brahma to be equal to or independent of the name of the Lord Vishnu.", "To disobey the orders of the spiritual master.", "To blaspheme the vedic scriptures or scriptures in pursuance to the vedic version.", "To consider the glories of chanting Hare Krishna to be an imagination.", "To give some interpretations to the holy name of the Lord.", "To commit sinful activities on the strength of the holy name.", "To consider the chanting of Hare Krishna as one of the auspicious ritualistic activities which are offered in the Vedas as frutive activities (Karma kanda).", "To instruct a faithless person about the glories of the holy name", "To not have complete faith in the chanting of the holy name and to maintain material attachments, even after understanding so many instructions on this matter. It is also an offense to be inattentive while chanting."], "note": "Every devotee who claims to be Vaishnava must guard against these offenses in order to quickly achieve the desired success KRISHNA PREMA!!!"}, {"title": "Gaura-Aarti", "byline": "from Gitavali", "verses": [{"n": 1, "label": "", "lines": ["(kiba) jaya jaya goracander aratiko sobha", "jahnavi-tata-vane jaga-mana-lobha", "jaga-jana-mana-lobha"], "tr": "All glories, all glories to the beautiful arati ceremony of Lord Caitanya. This Gaura-arati is taking place in a grove on the banks of the Jahnavi [Ganges] and is attracting the minds of all living entities in the universe."}, {"n": null, "label": "First Refrain", "lines": ["gauranger arotik sobha", "jaga-jana-mana-lobha"], "tr": ""}, {"n": 2, "label": "", "lines": ["dakhine nitaicand, bame gadadhara", "nikate adwaita, srinivasa chatra-dhara"], "tr": "On Lord Caitanya’s right side is Lord Nityananda, and on His left is Sri Gadadhara. Nearby stands Sri Advaita, and Srivasa Thakura is holding an umbrella over Lord Caitanya’s head."}, {"n": 3, "label": "", "lines": ["bosiyache goracand ratna-simhasane", "arati koren brahma-adi deva-gane"], "tr": "Lord Caitanya has sat down on a jeweled throne, and the demigods, headed by Lord Brahma, perform the arati ceremony."}, {"n": 4, "label": "", "lines": ["narahari-adi kori’ camara dhulaya", "sanjaya-mukunda-basu-ghosh-adi gaya"], "tr": "Narahari Sarakara and other associates of Lord Caitanya fan Him with camaras, and devotees headed by Sanjaya Pandita, Mukunda Datta, and Vasu Ghosha sing sweet kirtana."}, {"n": 5, "label": "", "lines": ["sankha baje ghanta baje baje karatala", "madhura mridanga baje parama rasala"], "tr": "Conchshells, bells, and karatalas resound, and the mridangas play very sweetly. This kirtana music is supremely sweet and relishable to hear."}, {"n": null, "label": "Second Refrain", "lines": ["sankha baje ghanta baje", "madhur madhur madhur baje"], "tr": ""}, {"n": 6, "label": "", "lines": ["bahu-koti candra jini’ vadana ujjvala", "gala-dese bana-mala kore jhalamala"], "tr": "The brilliance of Lord Caitanya’s face conquers millions upon millions of moons, and the garland of forest flowers around His neck shines."}, {"n": 7, "label": "", "lines": ["siva-suka-narada preme gada-gada", "bhakativinoda dekhe gorara sampada"], "tr": "Lord Siva, Sukadeva Gosvami, and Narada Muni are all there, and their voices are choked with the ecstasy of transcendental love. Thus Thakura Bhaktivinoda envisions the glory of Lord Sri Caitanya."}]}, {"title": "Sri Damodarashtaka", "byline": "", "verses": [{"n": 1, "label": "", "lines": ["namamisvaram sac-cid-ananda-rupam", "lasat-kundalam gokule bhrajamanam", "yasoda-bhiyolukhalad dhavamanam", "paramrishtam atyantato drutya gopya"], "tr": "To the Supreme Lord, whose form is the embodiment of eternal existence, knowledge, and bliss, whose shark-shaped earrings are swinging to and fro, who is beautifully shining in the divine realm of Gokula, who [due to the offense of breaking the pot of yogurt that His mother was churning into butter and then stealing the butter that was kept hanging from a swing] is quickly running from the wooden grinding mortar in fear of mother Yasoda, but who has been caught from behind by her who ran after Him with greater speed—to that Supreme Lord, Sri Damodara, I offer my humble obeisances."}, {"n": 2, "label": "", "lines": ["rudantam muhur netra-yugmam mrijantam", "karambhoja-yugmena satanka-netram", "muhuh svasa-kampa-trirekhanka-kanthasthita-", "graivam damodaram bhakti-baddham"], "tr": "Seeing the whipping stick in His mother’s hand,] He is crying and rubbing His eyes again and again with His two lotus hands. His eyes are filled with fear, and the necklace of pearls around His neck, which is marked with three lines like a conchshell, is shaking because of His quick breathing due to crying. To this Supreme Lord, Sri Damodara, whose belly is bound not with ropes but with His mother’s pure love, I offer my humble obeisances."}, {"n": 3, "label": "", "lines": ["itidrik sva-lilabhir ananda-kunde", "sva-ghosham nimajjantam akhyapayantam", "tadiyeshita-jneshu bhaktair jitatvam", "punah prematas tam satavritti vande"], "tr": "By such childhood pastimes as this He is drowning the inhabitants of Gokula in pools of ecstasy, and is revealing to those devotees who are absorbed in knowledge of His supreme majesty and opulence that He is only conquered by devotees whose pure love is imbued with intimacy and is free from all conceptions of awe and reverence. With great love I again offer my obeisances to Lord Damodara hundreds and hundreds of times."}, {"n": 4, "label": "", "lines": ["varam deva moksham na mokshavadhim va", "na canyam vrine ’ham vareshad apiha", "idam te vapur natha gopala-balam", "sada me manasy avirastam kim anyaih"], "tr": "O Lord, although You are able to give all kinds of benedictions, I do not pray to You for the boon of impersonal liberation, nor the highest liberation of eternal life in Vaikuntha, nor any other boon [which may be obtained by executing the nine processes of bhakti]. O Lord, I simply wish that this form of Yours as Bala Gopala in Vrindavana may ever be manifest in my heart, for what is the use to me of any other boon besides this?"}, {"n": 5, "label": "", "lines": ["idam te mukhambhojam atyanta-nilair", "vritam kuntalaih snigdha-raktais ca gopya", "muhus cumbitam bimba-raktadharam me", "manasy avirastam alam laksha-labhaih"], "tr": "O Lord, Your lotus face, which is encircled by locks of soft black hair tinged with red, is kissed again and again by mother Yasoda, and Your lips are reddish like the bimba fruit. May this beautiful vision of Your lotus face be ever manifest in my heart. Thousands and thousands of other benedictions are of no use to me."}, {"n": 6, "label": "", "lines": ["namo deva damodarananta vishno", "prasida prabho duhkha-jalabdhi-magnam", "kripa-drishti-vrishtyati-dinam batanu", "grihanesha mam ajnam edhy akshi-drisyah"], "tr": "O Supreme Godhead, I offer my obeisances unto You. O Damodara! O Ananta! O Vishnu! O master! O my Lord, be pleased upon me. By showering Your glance of mercy upon me, deliver this poor ignorant fool who is immersed in an ocean of worldly sorrows, and become visible to my eyes."}, {"n": 7, "label": "", "lines": ["kuveratmajau baddha-murtyaiva yadvat", "tvaya mocitau bhakti-bhajau kritau ca", "tatha prema-bhaktim svakam me prayaccha", "na mokshe graho me ‘sti damodareha"], "tr": "O Lord Damodara, just as the two sons of Kuvera—Manigriva and Nalakuvara—were delivered from the curse of Narada and made into great devotees by You in Your form as a baby tied with rope to a wooden grinding mortar, in the same way, please give to me Your own prema-bhakti. I only long for this and have no desire for any kind of liberation."}, {"n": 8, "label": "", "lines": ["namas te ’stu damne sphurad-dipti-dhamne", "tvadiyodarayatha visvasya dhamne", "namo radhikayai tvadiya-priyayai", "namo ’nanta-lilaya devaya tubhyam"], "tr": "O Lord Damodara, I first of all offer my obeisances to the brilliantly effulgent rope which binds Your belly. I then offer my obeisances to Your belly, which is the abode of the entire universe. I humbly bow down to your most beloved Srimati Radharani, and I offer all obeisances to You, the Supreme Lord, who displays unlimited pastimes."}]}, {"title": "Jaya Radha-Madhava", "byline": "from Gitavali", "verses": [{"n": null, "label": "", "lines": ["(jaya) radha-madhava (jaya) kunja-bihari", "(jaya) gopi-jana-vallabha (jaya) giri-vara-dhari", "(jaya) jasoda-nandana, (jaya) braja-jana-ranjana,", "(jaya) jamuna-tira-vana-cari"], "tr": "Krishna is the lover of Radha. He displays many amorous pastimes in the groves of Vrindavana, He is the lover of the cowherd maidens of Vraja, the holder of the great hill named Govardhana, the beloved son of mother Yasoda, the delighter of the inhabitants of Vraja, and He wanders in the forests along the banks of the River Yamuna."}]}];
var APP = "Krishna Island Songbook";
var KEY = "krishna-island-songbook";

var ICON = {
  left: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  chev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  lotus: '<svg class="mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 8c4 5 6 10 6 15s-2 9-6 12c-4-3-6-7-6-12s2-10 6-15z"/><path d="M24 35c-6 0-12-3-15-9 5-1 9 0 12 2M24 35c6 0 12-3 15-9-5-1-9 0-12 2"/><path d="M10 35c4 3 9 5 14 5s10-2 14-5"/></svg>'
};

var S = { theme: "auto", size: 0, tr: true, last: -1 };
try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); for (var k in S) if (o && o[k] !== undefined) S[k] = o[k]; } } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function applyTheme() {
  var r = document.documentElement;
  if (S.theme === "light" || S.theme === "dark") r.setAttribute("data-theme", S.theme); else r.removeAttribute("data-theme");
}

var view = { v: "home", n: 0 };

function renderHome() {
  var cont = "";
  if (S.last >= 0 && SONGS[S.last]) {
    cont = '<button type="button" class="cont" data-act="song" data-n="' + S.last + '">' + ICON.play + '<span><span class="k">Continue</span><span class="v">' + esc(SONGS[S.last].title) + '</span></span></button>';
  }
  var tiles = SONGS.map(function (s, i) {
    return '<button type="button" class="tile" data-act="song" data-n="' + i + '"><span class="t"><span class="vi">' + esc(s.title) + '</span>' + (s.byline ? '<span class="vd">' + esc(s.byline) + '</span>' : "") + '</span>' + ICON.chev + '</button>';
  }).join("");
  $("#view").innerHTML = '<div class="hero">' + ICON.lotus + '<h2>' + APP + '</h2><p>Mantras · Prayers · Kirtan</p></div>' + cont + '<div class="list">' + tiles + '</div><p class="foot">' + SONGS.length + ' songs</p>';
}

function renderSong(n) {
  var s = SONGS[n], h = '<article><div class="shead"><h2>' + esc(s.title) + '</h2>' + (s.byline ? '<p class="by">' + esc(s.byline) + '</p>' : "") + '</div>';
  if (s.kind === "list") {
    h += '<ol class="offs">' + s.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("") + '</ol>';
    if (s.note) h += '<p class="note">' + esc(s.note) + '</p>';
  } else {
    var max = S.size ? S.size : 21, min = S.size ? S.size : 15;
    s.verses.forEach(function (v, i) {
      if (i > 0) h += '<div class="vsep" aria-hidden="true"><i></i></div>';
      h += '<section class="verse"><div class="vbox" data-max="' + max + '" data-min="' + min + '">' + v.lines.map(function (l) { return '<span class="ln">' + esc(l) + '</span>'; }).join("") + '</div>';
      if (v.n) h += '<p class="vnum">‖ ' + v.n + ' ‖</p>';
      else if (v.label) h += '<p class="vnum ref">' + esc(v.label) + '</p>';
      if (S.tr && v.tr) h += '<p class="trad" style="font-size:' + (S.size ? Math.max(14, Math.round(S.size * 0.8)) : 15.5) + 'px">' + esc(v.tr) + '</p>';
      h += '</section>';
    });
  }
  $("#view").innerHTML = h + '</article>';
  var last = n === SONGS.length - 1;
  $("#vnav").innerHTML =
    (n > 0 ? '<button type="button" data-act="song" data-n="' + (n - 1) + '">' + ICON.left + 'Previous</button>' : '<button type="button" data-act="home">' + ICON.left + 'Songs</button>') +
    '<span class="cnt">' + (n + 1) + ' / ' + SONGS.length + '</span>' +
    (last ? '<button type="button" class="nx" disabled>Last song</button>' : '<button type="button" class="nx" data-act="song" data-n="' + (n + 1) + '">Next' + ICON.chev + '</button>');
  fit();
}

/* each verse line stays on one line, shrinking to fit the screen down to a minimum, then wraps */
function fit() {
  $$(".vbox").forEach(function (box) {
    var ls = $$(".ln", box), max = +box.dataset.max, min = +box.dataset.min, avail = box.clientWidth;
    if (!ls.length || !avail) return;
    var f = max, w;
    function widest() { return Math.max.apply(null, ls.map(function (l) { return l.scrollWidth; })); }
    ls.forEach(function (l) { l.style.whiteSpace = "nowrap"; l.style.fontSize = f + "px"; });
    w = widest();
    for (var k = 0; k < 6 && w > avail && f > min; k++) {
      f = Math.max(min, Math.floor(f * avail / w * 10) / 10 - 0.1);
      ls.forEach(function (l) { l.style.fontSize = f + "px"; });
      w = widest();
    }
    if (w > avail) ls.forEach(function (l) { l.style.whiteSpace = "normal"; });
  });
}
window.addEventListener("resize", fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

function render() {
  var song = view.v === "song";
  document.body.classList.toggle("in-song", song);
  $("#b-back").hidden = !song;
  $("#vnav").hidden = !song;
  var t = $("#tb-t");
  t.innerHTML = song ? '<h1>' + esc(SONGS[view.n].title) + '</h1>' + (SONGS[view.n].byline ? '<p>' + esc(SONGS[view.n].byline) + '</p>' : "") : "";
  if (song) renderSong(view.n); else renderHome();
}

function go(v, n) {
  closePop();
  view = { v: v, n: n || 0 };
  if (v === "song") { S.last = view.n; save(); }
  render();
  window.scrollTo(0, 0);
  try { var h = v === "song" ? "s" + (view.n + 1) : "home"; if (location.hash.slice(1) !== h) location.hash = h; } catch (e) {}
}
window.addEventListener("hashchange", function () {
  var m = /^#s(\d+)$/.exec(location.hash), n = m ? +m[1] - 1 : -1;
  var want = n >= 0 && n < SONGS.length ? { v: "song", n: n } : { v: "home", n: 0 };
  if (want.v !== view.v || want.n !== view.n) { closePop(); view = want; if (want.v === "song") { S.last = want.n; save(); } render(); window.scrollTo(0, 0); }
});

function popHtml() {
  var sz = S.size ? S.size + " px" : "Auto";
  function seg(v, label) { return '<button type="button" data-act="theme" data-val="' + v + '" aria-pressed="' + (S.theme === v) + '">' + label + '</button>'; }
  return '<div class="grp"><h3>Theme</h3><div class="seg">' + seg("auto", "Auto") + seg("light", "Day") + seg("dark", "Night") + '</div></div>' +
    '<div class="grp"><h3>Text size</h3><div class="stepper"><button type="button" data-act="size-" aria-label="Smaller">A−</button><output id="szv">' + sz + '</output><button type="button" data-act="size+" aria-label="Bigger">A+</button><button type="button" data-act="size0" aria-pressed="' + (!S.size) + '">Auto</button></div></div>' +
    '<div class="grp"><button type="button" class="sw" data-act="tr" role="switch" aria-checked="' + S.tr + '"><span>Show translation</span><i></i></button></div>';
}
function openPop() { $("#pop").innerHTML = popHtml(); $("#pop").hidden = false; $("#b-set").setAttribute("aria-expanded", "true"); }
function closePop() { $("#pop").hidden = true; $("#b-set").setAttribute("aria-expanded", "false"); }
function curSize() {
  if (S.size) return S.size;
  var l = $(".ln"); var f = l ? Math.round(parseFloat(getComputedStyle(l).fontSize)) : 19;
  return isNaN(f) ? 19 : f;
}

document.addEventListener("click", function (e) {
  var a = e.target.closest("[data-act]");
  if (!a) { if (!$("#pop").hidden && !e.target.closest("#pop")) closePop(); return; }
  var act = a.dataset.act;
  if (act === "set") { if ($("#pop").hidden) openPop(); else closePop(); return; }
  if (act === "theme") { S.theme = a.dataset.val; save(); applyTheme(); $("#pop").innerHTML = popHtml(); return; }
  if (act === "size+" || act === "size-" || act === "size0") {
    if (act === "size0") S.size = 0; else S.size = Math.max(14, Math.min(30, curSize() + (act === "size+" ? 1 : -1)));
    save(); if (view.v === "song") renderSong(view.n); $("#pop").innerHTML = popHtml(); return;
  }
  if (act === "tr") { S.tr = !S.tr; save(); if (view.v === "song") renderSong(view.n); $("#pop").innerHTML = popHtml(); return; }
  if (act === "song") go("song", +a.dataset.n);
  else go("home");
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closePop();
  else if (view.v === "song" && !e.target.closest("input,textarea")) {
    if (e.key === "ArrowRight" && view.n < SONGS.length - 1) go("song", view.n + 1);
    else if (e.key === "ArrowLeft" && view.n > 0) go("song", view.n - 1);
  }
});

applyTheme();
(function () {
  var m = /^#s(\d+)$/.exec(location.hash), n = m ? +m[1] - 1 : -1;
  if (n >= 0 && n < SONGS.length) { view = { v: "song", n: n }; S.last = n; }
  render();
})();
</script>
</body>
</html>
